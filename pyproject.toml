[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ckawalshko-safeval_jd061"
version = "0.1.0"
description = "在同一个输入里两两比对，检测模型安全评测负责人·张量并行切分策略相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ckawalshko" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ckawalshko.github.io"
Repository = "https://github.com/ckawalshko/safeval_jd061"
Issues = "https://github.com/ckawalshko/safeval_jd061/issues"

[project.scripts]
safeval_jd061 = "safeval_jd061:main"

[tool.setuptools]
py-modules = ["safeval_jd061"]
